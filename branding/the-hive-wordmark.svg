<svg xmlns="http://www.w3.org/2000/svg" width="777" height="326" viewBox="0 0 777 326">
  <!-- "The Hive" welcome wordmark: heavy type with a soft blur and grain,
       matching the treatment of the original onboarding artwork. -->
  <defs>
    <filter id="soft" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="blur" in2="noise" scale="10" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <text x="388.5" y="232" text-anchor="middle" filter="url(#soft)"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-weight="800" font-size="190" letter-spacing="-6" fill="#231F20">The Hive</text>
</svg>
